[project]
name = "aidan-lib"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Aidan Dempster", email = "aidan.dempster@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "h5py>=3.16.0",
    "jaxtyping>=0.3.9",
    "numpy>=2.4.4",
    "pydantic>=2.13.4",
]

[project.optional-dependencies]
hydra = [
    "hydra-core>=1.3.2",
]
torch = [
    "torch>=2.5.1",
    "torchvision>=0.20.1",
]
hf = [
    "aidan-lib[torch]",
    "transformers>=5.5.4",
    "accelerate>=1.13.0",
    "datasets>=2.19.1",
]
compiled_dino = [
    "torchmetrics>=1.0.3",
    "termcolor>=3.3.0",
]
sam3 = [
    "aidan-lib[hf]",
    "kornia>=0.8.2",
    "imageio[pyav]>=2.37.3",
]
sam3_research = [
    "aidan-lib[sam3,science]",
    "sam3",
    "opencv-python>=4.13.0.92",
    "einops>=0.8.2",
    "ninja>=1.13.0",
    "pycocotools>=2.0.11",
]
transnet = [
    "aidan-lib[torch]",
    "transnetv2-pytorch>=1.0.5",
]
science = [
    "scipy>=1.17.1",
    "matplotlib>=3.10.9",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.8.0",
]
dev = [
    "ipykernel>=7.2.0",
]

[build-system]
requires = ["uv_build>=0.9.24,<0.10.0"]
build-backend = "uv_build"

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cu124"

[tool.uv.sources]
sam3 = { git = "https://github.com/Veldrovive/sam3.git" }

[tool.uv.workspace]
members = []
